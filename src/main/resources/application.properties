spring.application.name=BoJogar

# Server
server.port=${SERVER_PORT:8080}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Jackson
spring.jackson.default-property-inclusion=non_null
spring.jackson.deserialization.fail-on-unknown-properties=false

# WhatsApp
whatsapp.api.token=${WHATSAPP_API_TOKEN}
whatsapp.api.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID}
whatsapp.api.verify-token=${WHATSAPP_VERIFY_TOKEN}
whatsapp.api.api-version=${WHATSAPP_API_VERSION:v22.0}
whatsapp.api.phone-number=${WHATSAPP_PHONE_NUMBER:5581983868651}

# AbacatePay
abacatepay.api-key=${ABACATEPAY_API_KEY:}
abacatepay.webhook-secret=${ABACATEPAY_WEBHOOK_SECRET:}
abacatepay.platform-fee-percent=${PLATFORM_FEE_PERCENT:10}

# Admin
bojogar.admin.phone=${ADMIN_SUPER_PHONE:}

# Actuator
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

# Logging
logging.level.com.bojogar.bot=INFO
