spring.application.name=BoJogar

# Server
server.port=${SERVER_PORT:8080}

# JPA
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
spring.jpa.open-in-view=false

# Jackson
spring.jackson.default-property-inclusion=non_null
spring.jackson.deserialization.fail-on-unknown-properties=false

# WhatsApp
whatsapp.api.token=${WHATSAPP_API_TOKEN}
whatsapp.api.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID}
whatsapp.api.verify-token=${WHATSAPP_VERIFY_TOKEN}
whatsapp.api.api-version=${WHATSAPP_API_VERSION:v22.0}
whatsapp.api.phone-number=${WHATSAPP_PHONE_NUMBER:5581983868651}

# SyncPay
syncpay.base-url=${SYNCPAY_BASE_URL:}
syncpay.client-id=${SYNCPAY_CLIENT_ID:}
syncpay.client-secret=${SYNCPAY_CLIENT_SECRET:}
syncpay.webhook-url=${SYNCPAY_WEBHOOK_URL:}
syncpay.webhook-token=${SYNCPAY_WEBHOOK_TOKEN:}
syncpay.platform-fee-percent=${SYNCPAY_PLATFORM_FEE_PERCENT:10}

# Logging
logging.level.com.bojogar.bot=INFO
